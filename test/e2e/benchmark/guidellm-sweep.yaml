apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-sweep
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: guidellm
          image: ghcr.io/vllm-project/guidellm:latest
          env:
            - name: USER
              value: "guidellm"
            - name: HF_HUB_CACHE
              value: "/tmp/hf_cache"
          command:
            - guidellm
            - benchmark
            - run
            - --target
            - "${GUIDELLM_TARGET}"
            - --request-format
            - text_completions
            - --model
            - "${GUIDELLM_MODEL}"
            - --profile
            - "${GUIDELLM_PROFILE}"
            - --rate
            - "${GUIDELLM_RATE}"
            - --max-seconds
            - "${GUIDELLM_MAX_SECONDS}"
            - --data
            - "prompt_tokens=256,output_tokens=128"
            - --output-dir
            - "/results"
            - --outputs
            - "${GUIDELLM_SCENARIO}.csv"
            - --processor
            - "${GUIDELLM_MODEL}"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results
